<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | لوحة تحكم رونزي</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Cairo', sans-serif; }
  .card-in { animation: cardIn .3s ease-out; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#071733] via-[#0D2855] to-[#163a75] flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <div class="inline-flex w-20 h-20 rounded-3xl bg-white items-center justify-center p-4 shadow-2xl mb-4">
        <svg viewBox="0 0 100 100" class="w-full h-full">
          <path d="M20,15 L60,15 C75,15 85,25 85,40 C85,55 75,65 60,65 L40,65 L40,85 L20,85 Z" fill="#0D2855"/>
          <polygon points="55,65 85,65 85,95" fill="#F26522"/>
        </svg>
      </div>
      <h1 class="text-3xl font-black text-white">RONZI STORE</h1>
      <p class="text-[#F26522] font-bold text-sm tracking-widest mt-1">متجر رونزي الإلكتروني</p>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-8 card-in">
      <h2 class="text-xl font-black text-[#0D2855] mb-1">تسجيل الدخول للوحة التحكم</h2>
      <p class="text-xs text-slate-500 mb-6">أدخل بيانات حسابك للوصول إلى إدارة المتجر</p>

      <form id="loginForm" class="space-y-4" novalidate>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">اسم المستخدم أو البريد</label>
          <input id="loginUser" type="text" autocomplete="username" autofocus
                 placeholder="admin"
                 class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-[#0D2855] focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">كلمة المرور</label>
          <div class="relative">
            <input id="loginPass" type="password" autocomplete="current-password"
                   placeholder="••••••••"
                   class="w-full px-4 py-3 pl-11 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-[#0D2855] focus:outline-none">
            <button type="button" id="togglePassBtn" tabindex="-1"
                    class="absolute left-3 top-3.5 text-slate-400 hover:text-slate-700">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>
          </div>
        </div>

        <label class="flex items-center gap-2.5 cursor-pointer select-none">
          <input id="rememberMe" type="checkbox" class="w-4 h-4 accent-[#F26522]">
          <span class="text-xs font-bold text-slate-600">تذكّرني على هذا الجهاز</span>
        </label>

        <div id="loginError" class="hidden text-xs font-bold text-rose-600 bg-rose-50 border border-rose-200 px-3.5 py-2.5 rounded-xl"></div>

        <button type="submit"
                class="w-full bg-[#F26522] hover:bg-[#D95314] text-white py-3.5 rounded-xl font-black shadow-lg transition-all hover:scale-[1.01] active:scale-95">
          دخول لوحة التحكم
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-slate-200 flex items-center justify-between">
        <a href="index.html" class="text-xs font-bold text-slate-500 hover:text-[#0D2855]">← رجوع للمتجر</a>
        <a href="admin.html" class="text-xs font-bold text-[#F26522] hover:underline">لوحة التحكم مباشرة</a>
      </div>
    </div>

    <div class="mt-6 bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-4">
      <div class="text-[11px] font-black text-white/80 mb-1.5">🔑 حساب تجريبي</div>
      <div class="text-[11px] text-white/60 leading-relaxed" dir="ltr">
        admin / admin123
      </div>
    </div>

  </div>

<script>
/* =========================================================
   تسجيل الدخول — يشارك نفس بيانات لوحة التحكم (ronziData)
   ========================================================= */
const STORAGE_KEY = 'ronziData';
const SESSION_KEY = 'ronziSession';

function loadUsers() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed.users) ? parsed.users : [];
  } catch (err) {
    console.warn('تعذر قراءة بيانات المستخدمين.', err);
    return [];
  }
}

const form = document.getElementById('loginForm');
const errBox = document.getElementById('loginError');

document.getElementById('togglePassBtn').onclick = () => {
  const p = document.getElementById('loginPass');
  p.type = p.type === 'password' ? 'text' : 'password';
};

function showError(msg) {
  errBox.textContent = msg;
  errBox.classList.remove('hidden');
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  errBox.classList.add('hidden');

  const idf = document.getElementById('loginUser').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;
  const remember = document.getElementById('rememberMe').checked;

  if (!idf || !pass) {
    showError('يرجى تعبئة اسم المستخدم وكلمة المرور');
    return;
  }

  const users = loadUsers();
  if (!users.length) {
    showError('ما في مستخدمين محفوظين. افتح لوحة التحكم (admin.html) أولاً لإنشاء حساب.');
    return;
  }

  const user = users.find(u =>
    (String(u.username).toLowerCase() === idf || String(u.email || '').toLowerCase() === idf) &&
    u.password === pass
  );

  if (!user) {
    showError('بيانات الدخول غير صحيحة — تأكد من اسم المستخدم وكلمة المرور');
    return;
  }
  if (user.active === false) {
    showError('هذا الحساب موقوف — تواصل مع المدير العام');
    return;
  }

  const session = JSON.stringify({ id: user.id, at: Date.now() });
  if (remember) {
    localStorage.setItem(SESSION_KEY, session);
  } else {
    sessionStorage.setItem(SESSION_KEY, session);
  }

  window.location.href = 'admin.html';
});
</script>
</body>
</html>
